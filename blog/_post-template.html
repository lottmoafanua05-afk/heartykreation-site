<!--
  Template used by the automated daily blog pipeline (.github/scripts/generate-post.mjs
  and api/approve.js). Placeholder tokens TITLE, DATE_TAG, BODY_HTML, CTA_URL, and
  CTA_TEXT (each wrapped in double curly braces in the markup below) are replaced at
  publish time. This file is not served directly.

  If you redesign the blog post layout, update this file AND blog/welcome-to-the-blog.html
  together so manual and automated posts stay visually consistent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Hearty Kreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dist/blog.css">
</head>
<body class="text-zinc-100">

<!-- NAV -->
<nav class="fixed top-0 w-full z-50 backdrop-blur bg-black/60 border-b border-[var(--line)]">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="font-display font-bold text-lg tracking-tight">
      HEARTY<span style="color:var(--signal)">KREATION</span>
    </a>
    <div class="hidden md:flex items-center gap-8 text-sm text-zinc-400">
      <a href="/#what-you-get" class="hover:text-white transition">What You Get</a>
      <a href="/#how-it-works" class="hover:text-white transition">How It Works</a>
      <a href="/#builds" class="hover:text-white transition">Recent Builds</a>
      <a href="/blog/" class="text-white transition">Blog</a>
    </div>
    <a href="/#start" class="btn-signal font-display font-semibold text-sm px-4 py-2 rounded-md">Get Started</a>
  </div>
</nav>

<!-- POST -->
<article class="grid-bg pt-40 pb-24 px-6">
  <div class="max-w-2xl mx-auto">
    <a href="/blog/" class="font-mono text-xs text-zinc-500 hover:text-zinc-300 transition">← Back to Blog</a>

    <div class="tag inline-block px-3 py-1 rounded-full mt-6 mb-6">{{DATE_TAG}}</div>
    <h1 class="font-display font-bold text-4xl md:text-5xl leading-tight mb-8">
      {{TITLE}}
    </h1>

    <div class="prose-post">
{{BODY_HTML}}
    </div>

    <div class="mt-10">
      <a href="{{CTA_URL}}" target="_blank" rel="noopener" class="btn-signal font-display font-semibold px-6 py-3 rounded-md inline-block">{{CTA_TEXT}}</a>
    </div>
  </div>
</article>

<!-- FOOTER -->
<footer class="border-t border-[var(--line)] py-10 px-6">
  <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-zinc-500">
    <span class="font-mono">© 2026 Hearty Kreation. All rights reserved.</span>
    <div class="flex gap-6">
      <a href="/privacy.html" class="hover:text-zinc-300">Privacy Policy</a>
      <a href="/terms.html" class="hover:text-zinc-300">Terms</a>
      <a href="mailto:info@heartykreation.com" class="hover:text-zinc-300">info@heartykreation.com</a>
    </div>
  </div>
</footer>

</body>
</html>
